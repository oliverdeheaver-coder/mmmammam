<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Potato Tag</title>

<style>
body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin-bottom:5px;
}

#info{
  margin:10px;
  font-size:18px;
}

canvas{
  background:#1f2937;
  border:3px solid white;
  border-radius:12px;
  max-width:95%;
}

button{
  margin:15px;
  padding:14px 25px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#38bdf8;
}
</style>
</head>

<body>

<h1>🔥 HOT POTATO TAG 🔥</h1>

<div id="info">
WASD / Arrow Keys to move
</div>

<div>
Time:
<b id="timer">10</b>

&nbsp;&nbsp;

Players:
<b id="players">6</b>
</div>

<br>

<canvas
id="game"
width="900"
height="550">
</canvas>

<br>

<button onclick="restartGame()">
RESTART
</button>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const timerText =
document.getElementById("timer");

const playersText =
document.getElementById("players");

let keys = {};

let gameOver = false;

let potatoTimer = 10;

let timerCounter = 0;


/* ------------------------
PLAYER
------------------------- */

const player = {

x:450,

y:275,

radius:20,

speed:4,

alive:true,

hasPotato:false,

color:"#38bdf8"

};


/* ------------------------
BOTS
------------------------- */

let bots = [];


function makeBots(){

bots = [];

const colors = [

"#ef4444",

"#22c55e",

"#eab308",

"#a855f7",

"#f97316"

];


for(let i=0;i<5;i++){

bots.push({

x:
100
+
Math.random()*700,

y:
80
+
Math.random()*390,

radius:20,

speed:
1.8
+
Math.random()*1.5,

angle:
Math.random()
*
Math.PI
*
2,

changeTimer:
Math.random()*100,

alive:true,

hasPotato:false,

color:colors[i]

});

}

}


/* ------------------------
CONTROLS
------------------------- */

document.addEventListener(
"keydown",
function(e){

keys[
e.key.toLowerCase()
]=true;

}
);


document.addEventListener(
"keyup",
function(e){

keys[
e.key.toLowerCase()
]=false;

}
);


/* ------------------------
MOVE PLAYER
------------------------- */

function movePlayer(){

if(!player.alive)
return;


if(
keys["w"]
||
keys["arrowup"]
)
player.y-=player.speed;


if(
keys["s"]
||
keys["arrowdown"]
)
player.y+=player.speed;


if(
keys["a"]
||
keys["arrowleft"]
)
player.x-=player.speed;


if(
keys["d"]
||
keys["arrowright"]
)
player.x+=player.speed;


player.x=
Math.max(
player.radius,
Math.min(
canvas.width-player.radius,
player.x
)
);


player.y=
Math.max(
player.radius,
Math.min(
canvas.height-player.radius,
player.y
)
);

}


/* ------------------------
MOVE BOTS
------------------------- */

function moveBots(){

bots.forEach(
function(bot){

if(!bot.alive)
return;


bot.changeTimer--;


if(bot.changeTimer<=0){

bot.angle +=

(Math.random()-.5)
*
2;


bot.changeTimer=

30
+
Math.random()*100;

}


/*
BOT WITH POTATO
TRIES TO CHASE PEOPLE
*/

if(bot.hasPotato){

let target =
findNearestPlayer(bot);

if(target){

bot.angle =

Math.atan2(

target.y-bot.y,

target.x-bot.x

);

}

}


/*
BOT WITHOUT POTATO
TRIES TO RUN AWAY
*/

else{

let potato =
getPotatoHolder();

if(potato){

let distance =

Math.hypot(

potato.x-bot.x,

potato.y-bot.y

);


if(distance<180){

bot.angle=

Math.atan2(

bot.y-potato.y,

bot.x-potato.x

);

}

}

}


bot.x +=

Math.cos(bot.angle)
*
bot.speed;


bot.y +=

Math.sin(bot.angle)
*
bot.speed;


/* bounce walls */

if(
bot.x<bot.radius
||
bot.x>
canvas.width-bot.radius
){

bot.angle =
Math.PI-bot.angle;

}


if(
bot.y<bot.radius
||
bot.y>
canvas.height-bot.radius
){

bot.angle =
-bot.angle;

}


bot.x=

Math.max(
bot.radius,
Math.min(
canvas.width-bot.radius,
bot.x
)
);


bot.y=

Math.max(
bot.radius,
Math.min(
canvas.height-bot.radius,
bot.y
)
);

}

);

}


/* ------------------------
POTATO HOLDER
------------------------- */

function getPotatoHolder(){

if(
player.alive
&&
player.hasPotato
){

return player;

}


for(
let bot of bots
){

if(
bot.alive
&&
bot.hasPotato
){

return bot;

}

}


return null;

}


/* ------------------------
ALL ALIVE PLAYERS
------------------------- */

function getAlive(){

let alive=[];


if(player.alive)
alive.push(player);


bots.forEach(
function(bot){

if(bot.alive)
alive.push(bot);

}
);


return alive;

}


/* ------------------------
NEAREST TARGET
------------------------- */

function findNearestPlayer(from){

let alive =
getAlive();

let nearest=null;

let distance=999999;


alive.forEach(
function(target){

if(target===from)
return;


let d=

Math.hypot(

target.x-from.x,

target.y-from.y

);


if(d<distance){

distance=d;

nearest=target;

}

}

);


return nearest;

}


/* ------------------------
PASS POTATO
------------------------- */

let passCooldown=0;


function checkTag(){

if(passCooldown>0){

passCooldown--;

return;

}


let holder =
getPotatoHolder();


if(!holder)
return;


let alive =
getAlive();


alive.forEach(
function(target){

if(
target===holder
||
!target.alive
)
return;


let distance=

Math.hypot(

holder.x-target.x,

holder.y-target.y

);


if(
distance
<
holder.radius
+
target.radius
){

holder.hasPotato=false;

target.hasPotato=true;

passCooldown=35;

}

}

);

}


/* ------------------------
POTATO TIMER
------------------------- */

function updateTimer(){

if(gameOver)
return;


timerCounter++;


if(timerCounter>=60){

timerCounter=0;

potatoTimer--;

timerText.textContent =
potatoTimer;


if(potatoTimer<=0){

explodePotato();

}

}

}


/* ------------------------
EXPLOSION
------------------------- */

function explodePotato(){

const holder =
getPotatoHolder();


if(holder){

holder.alive=false;

holder.hasPotato=false;

}


const alive =
getAlive();


playersText.textContent =
alive.length;


if(alive.length<=1){

gameOver=true;

return;

}


/* give potato to random survivor */

const randomPlayer =

alive[
Math.floor(
Math.random()
*
alive.length
)
];


randomPlayer.hasPotato=true;


potatoTimer=

6
+
Math.floor(
Math.random()*6
);


timerText.textContent=
potatoTimer;

}


/* ------------------------
DRAW PLAYER
------------------------- */

function drawPerson(person){

if(!person.alive)
return;


ctx.fillStyle =
person.color;


ctx.beginPath();

ctx.arc(

person.x,

person.y,

person.radius,

0,

Math.PI*2

);

ctx.fill();


/* eyes */

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
person.x-6,
person.y-5,
3,
0,
Math.PI*2
);

ctx.arc(
person.x+6,
person.y-5,
3,
0,
Math.PI*2
);

ctx.fill();


/* HOT POTATO */

if(person.hasPotato){

ctx.font="28px Arial";

ctx.textAlign="center";

ctx.fillText(

"🔥",

person.x,

person.y-28

);

}

}


/* ------------------------
DRAW GAME
------------------------- */

function draw(){

ctx.clearRect(

0,
0,
canvas.width,
canvas.height

);


/* arena */

ctx.fillStyle="#1f2937";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* centre area */

ctx.strokeStyle="#374151";

ctx.lineWidth=3;

ctx.beginPath();

ctx.arc(

450,

275,

100,

0,

Math.PI*2

);

ctx.stroke();


drawPerson(player);


bots.forEach(
function(bot){

drawPerson(bot);

}
);


/* eliminated count */

if(!player.alive){

ctx.fillStyle="white";

ctx.font="45px Arial";

ctx.textAlign="center";

ctx.fillText(

"YOU WERE ELIMINATED",

canvas.width/2,

canvas.height/2

);

}


/* winner */

if(gameOver){

let alive=
getAlive();


ctx.fillStyle="white";

ctx.font="55px Arial";

ctx.textAlign="center";


if(
alive.length===1
&&
alive[0]===player
){

ctx.fillText(

"🏆 YOU WIN!",

canvas.width/2,

canvas.height/2

);

}

else{

ctx.fillText(

"GAME OVER",

canvas.width/2,

canvas.height/2

);

}

}

}


/* ------------------------
RESTART
------------------------- */

function restartGame(){

player.x=450;

player.y=275;

player.alive=true;

player.hasPotato=false;


makeBots();


gameOver=false;

potatoTimer=10;

timerCounter=0;

passCooldown=0;


/*
Random first potato holder
*/

const everyone =
getAlive();

const first =

everyone[
Math.floor(
Math.random()
*
everyone.length
)
];


first.hasPotato=true;


timerText.textContent=
potatoTimer;

playersText.textContent=
everyone.length;

}


/* ------------------------
GAME LOOP
------------------------- */

function loop(){

if(!gameOver){

movePlayer();

moveBots();

checkTag();

updateTimer();

}


draw();


requestAnimationFrame(
loop
);

}


/* START */

restartGame();

loop();

</script>

</body>
</html>
